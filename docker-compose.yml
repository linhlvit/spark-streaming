version: "3.8"

services:

  # =========================================================
  # ORACLE
  # =========================================================
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-xe

    ports:
      - "1521:1521"

    environment:
      ORACLE_PASSWORD: oracle

    volumes:
      - oracle_data:/opt/oracle/oradata

    deploy:
      resources:
        limits:
          memory: 3g

    networks:
      - spark-net

  # =========================================================
  # ZOOKEEPER
  # =========================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_HEAP_OPTS: "-Xms256m -Xmx256m"

    networks:
      - spark-net

  # =========================================================
  # KAFKA
  # =========================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # =========================
      # LISTENERS
      # =========================
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092

      # =========================
      # ADVERTISED LISTENERS
      # =========================
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      # =========================
      # SECURITY
      # =========================
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      # =========================
      # INTER BROKER
      # =========================
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # =========================
      # REPLICATION
      # =========================
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"

    networks:
      - spark-net

  # =========================================================
  # SCHEMA REGISTRY
  # =========================================================
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema-registry

    depends_on:
      - kafka

    ports:
      - "8084:8081"

    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry

      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092

      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms256m -Xmx256m"

    networks:
      - spark-net

  # =========================================================
  # DEBEZIUM CONNECT
  # =========================================================
  connect:
    image: debezium/connect:2.6
    container_name: connect

    depends_on:
      - kafka
      - oracle

    ports:
      - "8083:8083"

    environment:
      BOOTSTRAP_SERVERS: kafka:29092

      GROUP_ID: oracle-connect

      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status

      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

      CONNECT_HEAP: "512m"

    networks:
      - spark-net

  # =========================================================
  # KAFKA UI
  # =========================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui

    depends_on:
      - kafka

    ports:
      - "8090:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: lab

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

    networks:
      - spark-net


  # =========================================================
  # DEBEZIUM UI
  # =========================================================
  debezium-ui:
    image: debezium/debezium-ui:latest
    container_name: debezium-ui

    depends_on:
      - connect

    ports:
      - "8085:8080"

    environment:
      KAFKA_CONNECT_URIS: http://connect:8083

    networks:
      - spark-net

  # =========================================================
  # MINIO HOT
  # =========================================================
  minio:
    image: minio/minio
    container_name: minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    networks:
      - spark-net

  # =========================================================
  # MINIO COLD
  # =========================================================
  minio-cold:
    image: minio/minio
    container_name: minio-cold

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123

    ports:
      - "9100:9000"
      - "9101:9001"

    volumes:
      - minio_data_cold:/data

    networks:
      - spark-net

  # =========================================================
  # SPARK MASTER
  # =========================================================
  spark-master:
    image: apache/spark:3.5.5
    container_name: spark-master
    user: root

    command: >
      bash -c "pip install oracledb --quiet &&
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master"

    ports:
      - "8080:8080"
      - "7077:7077"
      - "4050:4040"

    volumes:
      - "./jars:/opt/spark/jars-extra"
      - "./jobs:/opt/spark/jobs"
      - "./ivy2:/home/spark/.ivy2"
      - "./checkpoints:/opt/spark/checkpoints"

    networks:
      - spark-net

  # =========================================================
  # SPARK WORKER 1
  # =========================================================
  spark-worker-1:
    image: apache/spark:3.5.5
    container_name: spark-worker-1
    user: root

    command: >
      bash -c "pip install oracledb --quiet &&
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077"

    depends_on:
      - spark-master

    ports:
      - "8081:8081"

    volumes:
      - "./jars:/opt/spark/jars-extra"
      - "./jobs:/opt/spark/jobs"
      - "./ivy2:/home/spark/.ivy2"
      - "./checkpoints:/opt/spark/checkpoints"

    networks:
      - spark-net

  # =========================================================
  # SPARK WORKER 2
  # =========================================================
  spark-worker-2:
    image: apache/spark:3.5.5
    container_name: spark-worker-2
    user: root

    command: >
      bash -c "pip install oracledb --quiet &&
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077"

    depends_on:
      - spark-master

    ports:
      - "8082:8081"

    volumes:
      - "./jars:/opt/spark/jars-extra"
      - "./jobs:/opt/spark/jobs"
      - "./ivy2:/home/spark/.ivy2"
      - "./checkpoints:/opt/spark/checkpoints"

    networks:
      - spark-net

# =========================================================
# NETWORK
# =========================================================
networks:
  spark-net:
    driver: bridge

# =========================================================
# VOLUMES
# =========================================================
volumes:
  oracle_data:
  minio_data:
  minio_data_cold: