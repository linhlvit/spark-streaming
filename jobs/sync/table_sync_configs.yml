# ============================================================
# table_sync_configs.yml — Cấu hình CDC sync theo bảng
#
# Mỗi entry trong `tables` định nghĩa một streaming job độc lập:
#   Kafka topic  →  parse Debezium  →  foreachBatch  →  Oracle target
#
# Job đọc file này: jobs/sync/yaml_stream_processor.py
# Chạy:  spark-submit ... main.py --jobs yaml_sync
#        spark-submit ... main.py --jobs yaml_sync --sync-config /path/to/other.yml
# ============================================================

# ─────────────────────────────────────────────────────────────
# GLOBAL DEFAULTS — áp dụng cho tất cả bảng nếu không override
# ─────────────────────────────────────────────────────────────
defaults:
  kafka_bootstrap_servers: "kafka:29092"
  topic_prefix: "oracle.FSS_STREAM"
  checkpoint_base: "/opt/spark/checkpoints/oracle_schema_sync"
  trigger_interval: "3 seconds"
  max_offsets_per_trigger: 100000
  starting_offsets: "earliest"   # earliest | latest
  fail_on_data_loss: false


# ─────────────────────────────────────────────────────────────
# TABLES — danh sách bảng cần sync
# ─────────────────────────────────────────────────────────────
tables:

  # ──────────────────────────────────────────────
  # Bảng 1: T24_ACCOUNT → T24_ACCOUNT_TARGET
  # ──────────────────────────────────────────────
  - job_name: sync_t24_account          # Tên job (dùng trong log, checkpoint dir)
    enabled: true                        # false → bỏ qua bảng này khi khởi động

    # --- Kafka source ---
    topic: "oracle.FSS_STREAM.T24_ACCOUNT"   # override topic đầy đủ (bỏ qua topic_prefix nếu set)
    # topic_suffix: "T24_ACCOUNT"            # dùng khi muốn ghép với topic_prefix

    # --- Oracle target ---
    target_table: "T24_ACCOUNT_TARGET"   # Tên bảng đích (không có schema prefix)

    # --- Key & time guard ---
    key: "ACCOUNT_ID"                    # Primary key của bảng đích
    time_column: "UPDATED_AT"            # Cột timestamp last-write-wins (null = không guard)

    # --- Source schema (Debezium after/before payload) ---
    # Dùng để cast đúng kiểu khi ghi vào Oracle
    source_schema:
      ACCOUNT_ID:         VARCHAR2
      CUSTOMER_ID:        VARCHAR2
      WORKING_BALANCE:    NUMBER
      ONLINE_ACTUAL_BAL:  NUMBER
      CURRENCY_CODE:      VARCHAR2
      BRANCH_CODE:        VARCHAR2
      LAST_TX_TIME:       TIMESTAMP
      EVENT_TIME:         TIMESTAMP
      CREATED_AT:         TIMESTAMP
      UPDATED_AT:         TIMESTAMP

    # --- Target schema (DDL tham chiếu — không dùng để tạo bảng tự động) ---
    target_schema:
      ACCOUNT_ID:         "VARCHAR2(50)  PRIMARY KEY"
      CUSTOMER_ID:        "VARCHAR2(50)  NOT NULL"
      WORKING_BALANCE:    "NUMBER(18,2)"
      ONLINE_ACTUAL_BAL:  "NUMBER(18,2)"
      CURRENCY_CODE:      "VARCHAR2(10)"
      BRANCH_CODE:        "VARCHAR2(20)"
      LAST_TX_TIME:       "TIMESTAMP"
      EVENT_TIME:         "TIMESTAMP"
      CREATED_AT:         "TIMESTAMP"
      UPDATED_AT:         "TIMESTAMP"

    # --- Column mapping: nguồn → đích ---
    # Giá trị có thể là:
    #   tên_cột_nguồn          — copy trực tiếp
    #   "SELECT expr"          — biểu thức SQL/Spark (áp dụng trong get_json_object / withColumn)
    #   null                   — bỏ qua cột này (không ghi)
    mapping:
      ACCOUNT_ID:         ACCOUNT_ID
      CUSTOMER_ID:        CUSTOMER_ID
      WORKING_BALANCE:    WORKING_BALANCE
      ONLINE_ACTUAL_BAL:  ONLINE_ACTUAL_BAL
      CURRENCY_CODE:      CURRENCY_CODE
      BRANCH_CODE:        BRANCH_CODE
      LAST_TX_TIME:       LAST_TX_TIME
      EVENT_TIME:         EVENT_TIME
      CREATED_AT:         CREATED_AT
      UPDATED_AT:         UPDATED_AT

    # --- Override Kafka/Spark cho bảng này (tuỳ chọn) ---
    trigger_interval: "3 seconds"
    max_offsets_per_trigger: 200000


  # ──────────────────────────────────────────────
  # Bảng 2: T24_CUSTOMER → T24_CUSTOMER_TARGET
  # ──────────────────────────────────────────────
  - job_name: sync_t24_customer
    enabled: true

    topic: "oracle.FSS_STREAM.T24_CUSTOMER"

    target_table: "T24_CUSTOMER_TARGET"

    key: "CUSTOMER_ID"
    time_column: "UPDATED_AT"

    source_schema:
      CUSTOMER_ID:          VARCHAR2
      CUSTOMER_CODE_BIZ:    VARCHAR2
      CUSTOMER_TYPE:        VARCHAR2
      CUSTOMER_NAME:        VARCHAR2
      BIRTH_DATE:           DATE
      GENDER:               VARCHAR2
      SEGMENT:              VARCHAR2
      MANAGE_BRANCH_CODE:   VARCHAR2
      STATUS:               VARCHAR2
      OPEN_DATE:            DATE
      CLOSE_DATE:           DATE
      CREATED_AT:           TIMESTAMP
      UPDATED_AT:           TIMESTAMP
      BANK_KHOI:            VARCHAR2
      CUSTOMER_SEGMENT:     VARCHAR2

    target_schema:
      CUSTOMER_ID:          "VARCHAR2(50)   PRIMARY KEY"
      CUSTOMER_CODE_BIZ:    "VARCHAR2(50)"
      CUSTOMER_TYPE:        "VARCHAR2(10)"
      CUSTOMER_NAME:        "VARCHAR2(255)"
      BIRTH_DATE:           "DATE"
      GENDER:               "VARCHAR2(10)"
      SEGMENT:              "VARCHAR2(20)"
      MANAGE_BRANCH_CODE:   "VARCHAR2(20)"
      STATUS:               "VARCHAR2(10)"
      OPEN_DATE:            "DATE"
      CLOSE_DATE:           "DATE"
      CREATED_AT:           "TIMESTAMP(6)"
      UPDATED_AT:           "TIMESTAMP(6)"
      BANK_KHOI:            "VARCHAR2(50)"
      CUSTOMER_SEGMENT:     "VARCHAR2(50)"

    mapping:
      CUSTOMER_ID:          CUSTOMER_ID
      CUSTOMER_CODE_BIZ:    CUSTOMER_CODE_BIZ
      CUSTOMER_TYPE:        CUSTOMER_TYPE
      # Ví dụ mapping dùng expression — chuẩn hoá tên khách hàng thành UPPER
      CUSTOMER_NAME:        "UPPER(CUSTOMER_NAME)"
      BIRTH_DATE:           BIRTH_DATE
      GENDER:               GENDER
      SEGMENT:              SEGMENT
      MANAGE_BRANCH_CODE:   MANAGE_BRANCH_CODE
      STATUS:               STATUS
      OPEN_DATE:            OPEN_DATE
      CLOSE_DATE:           CLOSE_DATE
      CREATED_AT:           CREATED_AT
      UPDATED_AT:           UPDATED_AT
      BANK_KHOI:            BANK_KHOI
      CUSTOMER_SEGMENT:     CUSTOMER_SEGMENT


  # ──────────────────────────────────────────────
  # Bảng 3: T24_BRANCH → T24_BRANCH_TARGET
  # ──────────────────────────────────────────────
  - job_name: sync_t24_branch
    enabled: true

    topic: "oracle.FSS_STREAM.T24_BRANCH"

    target_table: "T24_BRANCH_TARGET"

    key: "BRANCH_CODE"
    time_column: null              # BRANCH ít thay đổi, không cần last-write-wins guard

    source_schema:
      BRANCH_CODE:    VARCHAR2
      BRANCH_NAME:    VARCHAR2
      REGION_CODE:    VARCHAR2
      REGION_NAME:    VARCHAR2

    target_schema:
      BRANCH_CODE:    "VARCHAR2(20)   PRIMARY KEY"
      BRANCH_NAME:    "VARCHAR2(255)  NOT NULL"
      REGION_CODE:    "VARCHAR2(20)   NOT NULL"
      REGION_NAME:    "VARCHAR2(255)  NOT NULL"

    mapping:
      BRANCH_CODE:    BRANCH_CODE
      BRANCH_NAME:    BRANCH_NAME
      REGION_CODE:    REGION_CODE
      REGION_NAME:    REGION_NAME


  # ──────────────────────────────────────────────
  # Bảng 4: T24_TRANSACTIONS → T24_TRANSACTIONS_TARGET
  # ──────────────────────────────────────────────
  - job_name: sync_t24_transactions
    enabled: true

    topic: "oracle.FSS_STREAM.T24_TRANSACTIONS"

    target_table: "T24_TRANSACTIONS_TARGET"

    key: "TRANSACTION_ID"
    time_column: "TRANSACTION_TIME"   # last-write-wins dựa trên thời điểm giao dịch

    source_schema:
      TRANSACTION_ID:     VARCHAR2
      ACCOUNT_ID:         VARCHAR2
      CUSTOMER_ID:        VARCHAR2
      TRANSACTION_DATE:   DATE
      VALUE_DATE:         DATE
      TRANSACTION_TIME:   TIMESTAMP
      TRANSACTION_TYPE:   VARCHAR2
      AMOUNT:             NUMBER
      CURRENCY_CODE:      VARCHAR2
      CHANNEL:            VARCHAR2
      INPUT_ID:           VARCHAR2
      AUTHOR_ID:          VARCHAR2
      BRANCH_CODE:        VARCHAR2
      REFERENCE_NO:       VARCHAR2
      TRANSACTION_STATUS: VARCHAR2

    target_schema:
      TRANSACTION_ID:     "VARCHAR2(50)   PRIMARY KEY"
      ACCOUNT_ID:         "VARCHAR2(50)   NOT NULL"
      CUSTOMER_ID:        "VARCHAR2(50)   NOT NULL"
      TRANSACTION_DATE:   "DATE           NOT NULL"
      VALUE_DATE:         "DATE           NOT NULL"
      TRANSACTION_TIME:   "TIMESTAMP(3)   NOT NULL"
      TRANSACTION_TYPE:   "VARCHAR2(50)   NOT NULL"
      AMOUNT:             "NUMBER(18,2)   NOT NULL"
      CURRENCY_CODE:      "VARCHAR2(10)   NOT NULL"
      CHANNEL:            "VARCHAR2(50)"
      INPUT_ID:           "VARCHAR2(50)"
      AUTHOR_ID:          "VARCHAR2(50)"
      BRANCH_CODE:        "VARCHAR2(20)   NOT NULL"
      REFERENCE_NO:       "VARCHAR2(100)"
      TRANSACTION_STATUS: "VARCHAR2(20)"

    # Ví dụ mapping dùng expression cho một cột
    mapping:
      TRANSACTION_ID:     TRANSACTION_ID
      ACCOUNT_ID:         ACCOUNT_ID
      CUSTOMER_ID:        CUSTOMER_ID
      TRANSACTION_DATE:   TRANSACTION_DATE
      VALUE_DATE:         VALUE_DATE
      TRANSACTION_TIME:   TRANSACTION_TIME
      TRANSACTION_TYPE:   TRANSACTION_TYPE
      # Ví dụ: đảm bảo AMOUNT luôn là giá trị tuyệt đối
      AMOUNT:             "ABS(AMOUNT)"
      CURRENCY_CODE:      CURRENCY_CODE
      CHANNEL:            CHANNEL
      INPUT_ID:           INPUT_ID
      AUTHOR_ID:          AUTHOR_ID
      BRANCH_CODE:        BRANCH_CODE
      REFERENCE_NO:       REFERENCE_NO
      TRANSACTION_STATUS: TRANSACTION_STATUS

    # Override riêng cho bảng này — giao dịch nhiều hơn, tăng batch size
    max_offsets_per_trigger: 200000
    trigger_interval: "2 seconds"
